name: Java GPA Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile source and tests
        run: |
          mkdir -p out
          javac -d out src/*.java test/GPACalculatorTest.java

      - name: Run GPA tests
        run: java -cp out GPACalculatorTest
